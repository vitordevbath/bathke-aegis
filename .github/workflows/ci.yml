name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      # Disposable database for the MySQL integration tests (migrations from zero,
      # transactional registration, full HTTP auth flow). Test-only credentials.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: aegis_ci
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/aegis_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Apply migrations to an empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/aegis_ci
      - run: npm test

  infrastructure:
    # Real Compose stack as an isolated project: build, startup, migrations, Nginx
    # routing and headers, published ports, networks, volume persistence. Runs in
    # parallel with the TypeScript job. Credentials are generated per run by the
    # script (disposable test values, not production secrets); no .env is used.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose version
      - run: npm run test:infra

  rust:
    # Aegis Collector (native/aegis-collector). Separate job: the Core jobs above never need Rust (ADR-006).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/aegis-collector
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain with rustfmt and clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/aegis-collector/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/aegis-collector/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-collector
          path: native/aegis-collector/target/release/aegis-collector
          retention-days: 7

  collector-e2e:
    # The real Collector binary from the rust job against the real Compose stack (isolated project):
    # pairing, heartbeat, SYSTEM_BOOT through the queue, /events, revocation and refusal afterwards,
    # plus a layout check of the web screens in headless Chrome (preinstalled on the runner).
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: aegis-collector
          path: collector-bin
      - run: chmod +x collector-bin/aegis-collector
      - run: npm run test:collector-e2e
        env:
          AEGIS_COLLECTOR_BIN: ${{ github.workspace }}/collector-bin/aegis-collector
          AEGIS_REQUIRE_BROWSER: '1'
