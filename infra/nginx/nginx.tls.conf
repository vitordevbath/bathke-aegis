# HTTPS entry point (ADR-055), used through compose.tls.yaml. The server blocks live in
# templates/aegis-tls.conf.template: the nginx image renders it with envsubst at startup
# (certificate paths, public HTTPS port, server name) into /etc/nginx/aegis/.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  upstream aegis_web { server web:80; }
  upstream aegis_api { server api:3000; }

  include /etc/nginx/aegis/*.conf;
}
