worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  upstream aegis_web { server web:80; }
  upstream aegis_api { server api:3000; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Strict CSP: the SPA keeps its JWT in localStorage (academic requirement),
    # so script injection must be prevented — no inline or third-party scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # /api/* → api:/* (prefix stripped by the trailing slash), e.g. /api/auth/login → /auth/login.
    location /api/ {
      proxy_pass http://aegis_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://aegis_web;
      proxy_set_header Host $host;
    }
  }
}
