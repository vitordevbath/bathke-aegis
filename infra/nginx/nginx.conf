# HTTP entry point (default, development and the infra test). HTTPS: nginx.tls.conf via compose.tls.yaml.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  upstream aegis_web { server web:80; }
  upstream aegis_api { server api:3000; }

  server {
    listen 80;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/aegis-routes.conf;
  }
}
