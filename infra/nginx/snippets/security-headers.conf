# Security headers shared by the HTTP (nginx.conf) and HTTPS (nginx.tls.conf) entry points.
# Included at server level; no location adds its own headers, so these are never dropped.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# Strict CSP: the SPA keeps its JWT in localStorage (academic requirement),
# so script injection must be prevented — no inline or third-party scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
