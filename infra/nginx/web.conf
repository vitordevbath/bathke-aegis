# Static server inside the web container. SPA fallback to index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Built files carry a content hash in the name: cache them for good. A name that no longer
  # exists (a tab opened before a new build) is a real 404, never index.html served as JavaScript;
  # the panel then reloads itself once and picks up the new build.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html (and every SPA route that falls back to it) is revalidated on each visit,
  # so a new build is seen right away.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
